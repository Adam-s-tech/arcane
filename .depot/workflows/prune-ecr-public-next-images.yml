name: Prune ECR Public Next Images

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: prune-ecr-public-next-images
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    runs-on:
      size: 4x16
      image: g7r5wqb57k.registry.depot.dev/ci:latest
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.ECR_PUBLIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ECR_PUBLIC_SECRET_ACCESS_KEY }}

    steps:
      - name: Login to ECR Public
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: public.ecr.aws
          username: ${{ secrets.ECR_PUBLIC_ACCESS_KEY_ID }}
          password: ${{ secrets.ECR_PUBLIC_SECRET_ACCESS_KEY }}

      - name: Delete stale next images
        run: |
          # Release and next tags stay; only untagged manifests no longer referenced by any tag are removed.
          # ECR Public has no lifecycle policies, so this keeps overwritten next images from eating the free tier.
          cutoff=$(date -u -d '1 hour ago' +%FT%T)
          for repo in manager agent; do
            aws ecr-public describe-images --repository-name "$repo" --output json > "$RUNNER_TEMP/images.json"
            jq -r '.imageDetails[] | select(.imageTags) | .imageDigest' "$RUNNER_TEMP/images.json" > "$RUNNER_TEMP/tagged.txt"
            while read -r digest; do
              docker buildx imagetools inspect "public.ecr.aws/getarcaneapp/$repo@$digest" --raw | jq -r '.manifests[]?.digest'
            done < "$RUNNER_TEMP/tagged.txt" | cat - "$RUNNER_TEMP/tagged.txt" | sort -u > "$RUNNER_TEMP/keep.txt"
            jq -r --arg cutoff "$cutoff" '.imageDetails[] | select((.imageTags | not) and .imagePushedAt < $cutoff) | .imageDigest' "$RUNNER_TEMP/images.json" \
              | sort -u | comm -23 - "$RUNNER_TEMP/keep.txt" > "$RUNNER_TEMP/delete.txt"
            sed 's/^/imageDigest=/' "$RUNNER_TEMP/delete.txt" | xargs -r -n 100 aws ecr-public batch-delete-image --repository-name "$repo" --image-ids > /dev/null
            echo "$repo: deleted $(wc -l < "$RUNNER_TEMP/delete.txt" | tr -d ' ') stale manifests" >> "$GITHUB_STEP_SUMMARY"
          done
